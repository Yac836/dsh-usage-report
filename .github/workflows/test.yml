name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin targets the Node versions DSH itself supports.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The runtime peers (zod, @earendil-works/pi-ai) are provided by the DSH
      # installation; they are devDependencies only so the test suite can run
      # against a bare checkout.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify -- --version 0.2.0-rc.2
      - run: npm test

  windows-deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/test/sync-deploy.test.mjs
      - shell: pwsh
        run: ./scripts/test/sync-deploy.Tests.ps1
